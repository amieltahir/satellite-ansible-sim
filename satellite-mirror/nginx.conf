server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        autoindex on;
    }

    # Directly return the mock API payload for the repositories endpoint
    location = /api/v2/organizations/1/repositories {
        default_type application/json;
        return 200 '[{"id": 1, "label": "gts-automation-rpm-release", "name": "GTS Automation RPM Release", "url": "http://172.30.0.3/repos/release/", "content_credential_url": "http://172.30.0.3/keys/RPM-GPG-KEY-gts-automation"}]';
    }
}
