---
- name: Validate Nexus read credentials
  ansible.builtin.assert:
    that:
      - nexus_read_username | length > 0
      - nexus_read_password | length > 0
    fail_msg: "Set NEXUS_READ_USER and NEXUS_READ_PASSWORD."

- name: Configure Nexus RPM repository
  ansible.builtin.yum_repository:
    name: "{{ item.label }}"
    description: "{{ item.name }}"
    baseurl: "{{ item.url }}"
    enabled: true
    gpgcheck: false
    username: "{{ nexus_read_username }}"
    password: "{{ nexus_read_password }}"
    state: present
  loop: "{{ hostvars['localhost']['resolved_repositories'] }}"

- name: Install packages from Nexus
  ansible.builtin.dnf:
    name: "{{ packages_to_install }}"
    state: present
    update_cache: true

- name: Verify installed RPM version
  ansible.builtin.command:
    argv:
      - rpm
      - -q
      - --qf
      - "%{NAME} %{VERSION}-%{RELEASE}.%{ARCH}\n"
      - test-pkg
  register: package_verification
  changed_when: false

- name: Display installed package
  ansible.builtin.debug:
    msg: "{{ package_verification.stdout }}"
